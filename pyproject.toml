[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.2.0"
description = "Lean, recoverable Linux coding harness for Loopie and OpenAI-compatible local models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
loopforge = "loopforge.cli:main"

[tool.setuptools.packages.find]
include = ["loopforge*"]
